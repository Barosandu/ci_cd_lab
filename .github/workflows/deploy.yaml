name: Build CI/CD

# Trigger the workflow on a commit push to the `main` branch
on:
  push:
    branches:
      - main

jobs:
  # Job to run tests
  test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository code into the runner
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Set up Go environment with version 1.22
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      # Step 3: Download Go module dependencies
      - name: Install dependencies
        run: go mod download
      
      # Step 4: Run tests
      - name: Run tests
        run: go test ./...

  # Job to compile the application
  compile:
    # Make sure that the `test` job is run before `compile`
    needs: test
    
    # Specify the OS for the runner (container)
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the repository code into the runner
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Set up Go environment with version 1.22
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      # Step 3: Download Go module dependencies
      - name: Install dependencies
        run: go mod download
      
      # Step 4: Compile the Go application into a binary named 'myapp'
      - name: Compile binary
        run: go build -o myapp

  # Job to build and push Docker image to GitHub Container Registry
  build:
    # Specify the OS for the runner
    runs-on: ubuntu-latest
    
    # Grant write permissions to access repository contents and GitHub Container Registry
    permissions:
      contents: write
      packages: write
    
    # Run this job only after the 'compile' job completes successfully
    needs: compile
    if: success()
    
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Log in to GitHub Container Registry (GHCR) using GitHub Actions token
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}             # GitHub username (actor triggering the workflow)
          password: ${{ secrets.GITHUB_TOKEN }}     # Automatically provided GitHub token
      
      # Step 3: Build the Docker image and tag it with the repository name and 'latest'
      - name: Build Docker image
        run: docker build -t ghcr.io/barosandu/ci_cd_lab:latest .
      
      # Step 4: Push the Docker image to GitHub Container Registry
      - name: Push Docker image
        run: docker push ghcr.io/barosandu/ci_cd_lab:latest
