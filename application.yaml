apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-simple-webserver
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://github.com/Barosandu/ci_cd_lab.git
    targetRevision: HEAD
    path: manifests
  
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  
  # Enable auto-sync
  syncPolicy:
    automated:
      prune: true      # Delete resources that are no longer in Git
      selfHeal: true   # Auto-sync when cluster state differs from Git
    syncOptions:
      - CreateNamespace=true
